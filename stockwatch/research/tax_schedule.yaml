# 매도 시 부과되는 세금 (백테스트 전용 · 실주문 원장은 토스가 돌려준 실제 수수료/세금을 쓴다)
#   증권거래세   : 증권거래세법 시행령 제5조 탄력세율 (법률상 기본세율 0.35%)
#   농어촌특별세 : 코스피 매도분에만 0.15% (농어촌특별세법 제5조). 코스닥에는 없음
# 적용 기준일 = '양도일'(결제일, T+2). 체결일이 아니다 → 엔진이 매도 체결일에서 결제일을 계산해 조회한다.
#
# ⚠ 검증 수준: 보도·해설(2차 출처) 기반. 법령 원문(국가법령정보센터 '증권거래세법 시행령' 제5조 연혁)은 직접 확인하지 못했다.
#   값이 틀리면 이 파일만 고치면 된다. 이 표가 덮는 첫 날짜 이전을 조회하면 CostScheduleError 로 멈춘다(조용히 현재 세율로 대체하지 않는다).
periods:
  - from: "2021-01-01"        # 2021-01-01 ~ 2022-12-31
    STK: {transaction: 0.0008, rural: 0.0015}      # 합계 0.23%
    KSQ: {transaction: 0.0023, rural: 0.0}         # 합계 0.23%
  - from: "2023-01-01"
    STK: {transaction: 0.0005, rural: 0.0015}      # 합계 0.20%
    KSQ: {transaction: 0.0020, rural: 0.0}
  - from: "2024-01-01"
    STK: {transaction: 0.0003, rural: 0.0015}      # 합계 0.18%
    KSQ: {transaction: 0.0018, rural: 0.0}
  - from: "2025-01-01"
    STK: {transaction: 0.0, rural: 0.0015}         # 합계 0.15% (코스피 거래세 0%)
    KSQ: {transaction: 0.0015, rural: 0.0}
  - from: "2026-01-01"
    STK: {transaction: 0.0005, rural: 0.0015}      # 합계 0.20%
    KSQ: {transaction: 0.0020, rural: 0.0}
